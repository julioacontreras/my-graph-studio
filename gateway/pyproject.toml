[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mygraph-studio-gateway"
version = "0.1.0"
description = "HTTP gateway between MyGraph Studio and mygraph-server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "mygraph-client>=0.2,<0.3",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/mygraph_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs a running mygraph-server"]

[tool.ruff]
line-length = 110
target-version = "py311"
